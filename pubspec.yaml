publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.4
  path: ^1.9.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  local_auth: ^3.0.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
